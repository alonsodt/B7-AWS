# =============================================================
# secretos.yml — Busca claves y contraseñas en el repositorio
# =============================================================
# ¿Por qué? El repo es PÚBLICO. Si alguien sube por error una clave de AWS,
# este workflow lo detecta y el check del commit / pull request sale en rojo.
#
# ¿Cómo? Usa "gitleaks", una herramienta que busca patrones típicos de
# secretos (claves de AWS, tokens, contraseñas...) en el código y en el historial.
# Más info: docs/seguridad.md
#
# Nota: usamos el programa gitleaks directamente (no la "action" oficial)
# porque la action falla en el primer push de un repo nuevo: intenta revisar
# desde el commit anterior al primero, que no existe. Así además revisamos
# SIEMPRE el historial completo, que en un repo pequeño tarda segundos.

name: secretos

# Se ejecuta en cada push (a cualquier rama) y en cada pull request.
on:
  push:
  pull_request:

# Permisos mínimos: solo necesita LEER el código.
permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.21.2"   # versión fija: así el resultado no cambia por sorpresa

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # 1) Descargar el código. fetch-depth: 0 = todo el historial,
      #    porque un secreto "borrado" sigue estando en commits antiguos.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Descargar gitleaks desde su página oficial de versiones en GitHub.
      - name: Instalar gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks

      # 3) Revisar todo el historial de Git.
      #    --redact: si encuentra algo, NO lo imprime entero en el log (el log también es público).
      #    Si hay hallazgos, gitleaks termina con error y el check sale en rojo.
      - name: Buscar secretos en el historial
        run: ./gitleaks git . --redact --verbose
